<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bigC company</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="description" content="bigC company 사장님 앱 · 예시 데이터로 눌러 보는 판">
<meta name="theme-color" content="#f3f5f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1012" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="bigC company">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app" data-mode="owner">
        <div class="sbar" aria-hidden="true"><span class="num" id="clock">18:20</span><span class="isl"></span>
          <svg width="66" height="14" viewBox="0 0 66 14" fill="currentColor"><rect x="0" y="9" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="8" rx="1"/><rect x="10" y="3" width="3" height="11" rx="1"/><rect x="15" y="0" width="3" height="14" rx="1"/><path d="M30 4.5a10 10 0 0 1 13 0l-1.6 1.7a7.6 7.6 0 0 0-9.8 0zM33 7.6a5.6 5.6 0 0 1 7 0L36.5 11z"/><rect x="46" y="1" width="18" height="12" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="48" y="3" width="12" height="8" rx="2"/></svg>
        </div>

        <div class="lock" id="lock">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="56.0" height="56" role="img" aria-label="bigC company"><rect width="100" height="100" rx="22" fill="#0f1416"/><g fill="none" stroke-width="17" stroke-linecap="butt"><path d="M72.29 70.07A30 30 0 0 1 39.74 78.19" stroke="#eef2f3"/><path d="M31.53 73.64A30 30 0 0 1 22.18 38.76" stroke="#eef2f3"/><path d="M27.02 30.72A30 30 0 0 1 72.29 29.93" stroke="#4fc1ae"/></g></svg>
          <h3 id="lockName">망고마트</h3>
          <p class="ask" id="ask" role="status" aria-live="polite">PIN 네 자리를 누르십시오</p>
          <div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          <div class="keys" id="keys">
            <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
            <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
            <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
            <button class="aux" data-k="bio" aria-label="지문으로 열기 · 준비 중"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 11v3a7 7 0 0 1-1.2 4M8.5 7.6A4.5 4.5 0 0 1 16.5 10.5v2.3a11 11 0 0 1-1 4.6M7.5 11v2.5a5 5 0 0 1-.9 2.9M5 8.5a8 8 0 0 1 14.3-1.8M19.8 11v1.6a14 14 0 0 1-.6 4"/></svg></button>
            <button data-k="0">0</button>
            <button class="aux" data-k="del" aria-label="지우기"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11v14H9l-6-7z"/><path d="m12.5 9.5 5 5m0-5-5 5"/></svg></button>
          </div>
          <button class="lnk" id="pinForget" hidden>PIN 잊음</button>
          <div class="forget" id="forgetBox" hidden>
            <p>예시 데이터를 지우고 PIN을 다시 정합니다. 끝낸 일 · 고른 업종 · 단계가 처음으로 돌아가고, 본부 서버 연결(토큰)도 이 폰에서 지워집니다.</p>
            <div class="acts"><button class="btn p" id="forgetYes">지우고 다시 정하기</button><button class="btn" id="forgetNo">취소</button></div>
          </div>
          <p class="foot" id="lockFoot">처음 한 번 정하면 다음부터 이 PIN이 맞아야 열립니다.</p>
        </div>

        <div class="shell" id="shell">
          <div class="band" id="band" hidden></div>
          <main class="view" id="view"></main>
          <div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button class="ua" id="toastAct" hidden>되돌리기</button></div>
          <nav class="tabs" id="tabs" role="tablist" aria-label="앱 탭"></nav>
          <div class="scrim" id="scrim"></div>
          <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="자세히"><div class="grab" id="grab"><i></i></div><div class="body" id="sheetBody"></div></div>
        </div>
      </div>
<noscript><p style="padding:24px">이 앱은 자바스크립트를 켜야 열립니다.</p></noscript>
<script src="app.js"></script>
</body>
</html>
