 if(st.step==='start')h+=`<div class="grid2"><button type="button" class="entry" data-entry="photo"><b>사진 한 장</b><span>쓰시는 엑셀·장부·카톡 주문 화면. 이름과 금액은 가려도 됩니다</span></button><button type="button" class="entry" data-entry="q"><b>질문 3개</b><span>번호만 고르시면 바로 화면이 나옵니다</span></button></div>`;
 else if(st.entry)h+=me(st.entry==='photo'?'사진으로 할게요':'질문 3개','start','entry');
 if(st.entry==='photo'){h+=bot('사진은 이 글을 올린 bigC company 1:1 채팅으로 보내 주십시오. 어느 숫자가 맞지 않는지 진단 카드 한 장으로 보여 드립니다. 진단 카드는 무료이고, 받으셨다고 맡기실 필요는 없습니다.');
  if(st.step==='photo')h+=`<div class="acts"><button type="button" class="btn ghost" data-entry="q">질문으로 할게요</button></div>`;}
 if(st.entry==='q'){
  h+=bot('어떤 일을 하시는 곳입니까?');
  if(st.step==='q1')h+=opts(INDS,'ind','q2');
  else if(st.ind)h+=me(lab(INDS,st.ind),'q1','ind');
 }
 if(st.ind&&!c){h+=bot('이 업종은 눌러 보는 화면을 준비하고 있습니다. 고르신 내용으로 바로 물어보실 수 있습니다.');if(st.step==='other')h+=`<div class="acts"><button type="button" class="btn" data-go="summary">이 정리로 물어보기</button></div>`;}
 if(c){
  h+=bot(c.ask)+`<p class="why">해당하는 것을 모두 골라 주십시오.</p>`;
  if(st.step==='q2'){h+='<div class="opts" role="group" aria-label="매장 고충">';c.pains.forEach((p,i)=>h+=`<button type="button" class="opt multi" data-pick="${p[0]}" aria-pressed="${st.pick.includes(p[0])}"><b>${i+1}</b><span>${p[1]}</span></button>`);
   h+=`<button type="button" class="opt idk multi" data-pick="idk" aria-pressed="${st.pick.includes('idk')}"><b>${c.pains.length+1}</b><span>잘 모르겠어요</span></button></div>`;
   h+=`<div class="acts"><button type="button" class="btn" id="next2" ${st.pick.length?'':'disabled'}>${st.pick.length?`${st.pick.includes('idk')?'':st.pick.length+'개 '}골랐습니다 · 다음`:'하나 이상 골라 주십시오'}</button></div>`;}
  else if(st.pains.length)h+=me(st.pains.map(p=>p==='idk'?'잘 모르겠어요':short(p)).join(' · '),'q2','pains');
 }
 
 if(c&&st.step!=='q2'&&st.pains.filter(p=>p!=='idk').length>1){
  h+=bot('이 가운데 가장 먼저 덜고 싶은 것 하나는 무엇입니까?')+`<p class="why">나머지는 쓰시면서 하나씩 더하실 수 있습니다.</p>`;
  if(st.step==='q2b'){h+='<div class="opts">';st.pains.forEach((k,i)=>h+=`<button type="button" class="opt" data-first="${k}"><b>${i+1}</b><span>${lab(c.pains,k)}</span></button>`);h+='</div>';}
  else if(st.first)h+=me(short(st.first),'q2b','first');
 }
 if(c&&st.pains.length&&st.step!=='q2'&&st.step!=='q2b'){
  h+=bot(st.pains.length>1?'그 일들을 지금 주로 무엇으로 하십니까?':'그 일을 지금 무엇으로 하십니까?');
  if(st.step==='q3')h+=opts(c.tools,'tool','result',true);
  else if(st.tool)h+=me(st.tool==='idk'?'모르겠어요':lab(c.tools,st.tool),'q3','tool');
 }
 if(c&&st.tool&&st.step!=='q2b'){
  const n=st.pains.filter(p=>p!=='idk').length;
  h+=bot(n>1?`고르신 고충 ${n}가지가 이렇게 바뀝니다. 위 단추로 하나씩 보실 수 있습니다.`:n?'이렇게 바뀝니다.':'대표님들이 가장 많이 고르시는 묶음으로 보여 드립니다.');
  h+=resultCard();
  if(st.step==='result')h+=`<div class="acts"><button type="button" class="btn" data-go="summary">이 정리로 물어보기</button><button type="button" class="btn ghost" data-go="m4">더 정확하게 (4문항 · 상호를 넣으면 ${c.place||'매장'} 이름으로)</button></div>`;
 }
 const seq=['m4','m5','m6','m7','result2'];const cur=seq.indexOf(st.step);
 if(c)c.more.forEach(([q,list],i)=>{
  const s=seq[i],key='a'+i,next=seq[i+1];
  const show=cur>=i||(st.step==='summary'&&st[key]!=null);if(!show)return;
  h+=bot(q);
  if(st.step===s){h+='<div class="opts">';list.forEach((x,j)=>h+=`<button type="button" class="opt" data-k="${key}" data-v="${j}" data-n="${next}"><b>${j+1}</b><span>${x}</span></button>`);h+=`<button type="button" class="opt idk" data-k="${key}" data-v="-1" data-n="${next}"><b>${list.length+1}</b><span>모르겠어요</span></button></div>`;}
  else if(st[key]!=null)h+=me(st[key]<0?'모르겠어요':list[st[key]],s,key);
 });
 if(c&&(cur>=3||(st.step==='summary'&&st.moreDone))){
  h+=bot(`상호와 좋아하시는 색을 알려 주십시오. 시안에 ${c.place||'매장'} 이름을 넣어 드립니다.`)+`<p class="why">가명도 됩니다. 비워 두셔도 됩니다.</p>`;
  if(st.step==='m7')h+=`<div class="field"><input id="storeName" type="text" maxlength="24" placeholder="${c.ph}" value="${esc(st.name)}" aria-label="상호"><div class="sw" role="group" aria-label="색">${COLORS.map(x=>`<button type="button" data-color="${x[0]}" style="background:${x[0]}" aria-label="${x[1]}" aria-pressed="${st.color===x[0]}"></button>`).join('')}</div><button type="button" class="btn" id="redraw">다시 그리기</button></div>`;
  else if(st.moreDone){h+=me(st.name?esc(st.name):'—','m7','name');h+=bot('알려 주신 상황으로 다시 그렸습니다.')+resultCard();
   if(st.step==='result2')h+=`<div class="acts"><button type="button" class="btn" data-go="summary">이 정리로 물어보기</button></div>`;}
 }
 if(st.step==='summary'){
  if(!st.summary)st.summary=understood();
  h+=bot('제가 이해한 것을 정리했습니다. 틀린 곳은 고쳐 주십시오. 고치신 문장이 그대로 대표님께 갑니다.');
  h+=`<div class="field"><label class="why" for="und">제가 이해한 것</label><textarea id="und">${esc(st.summary)}</textarea></div>`;
  h+=`<div class="sum"><span class="k">대표님께 가는 정리</span><span id="sumText" style="white-space:pre-line">${esc(buildSummary())}</span></div>`;
  h+=`<div class="acts"><button type="button" class="btn" id="copy">정리 복사하기</button><button type="button" class="btn" disabled>bigC company에 바로 보내기</button><p class="why" style="text-align:center">텔레그램을 잇고 나면 켜집니다 (B3)</p></div><p class="toast" id="toast" role="status"></p>`;
  h+=bot('복사한 글을 bigC company 1:1 채팅에 붙여 넣어 주십시오. 진단 카드는 무료이고, 받으셨다고 맡기실 필요는 없습니다.');
  h+=`<div class="acts"><button type="button" class="btn ghost" id="restart">처음부터 다시</button></div>`;
 }
 thread.innerHTML=h;

 thread.querySelectorAll('[data-entry]').forEach(b=>b.onclick=()=>{if(b.dataset.entry==='photo')Object.assign(st,{entry:'photo',step:'photo'});else Object.assign(st,{entry:'q',step:'q1'});render(true);});
 thread.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k,raw=b.dataset.v;st[k]=MORE.includes(k)?+raw:raw;st.step=b.dataset.n;
   if(k==='ind'){st.pick=[];if(!T[raw])st.step='other';}render(true);});
 thread.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const v=b.dataset.pick;
   if(v==='idk')st.pick=st.pick.includes('idk')?[]:['idk'];else{st.pick=st.pick.filter(x=>x!=='idk');st.pick=st.pick.includes(v)?st.pick.filter(x=>x!==v):[...st.pick,v];}
   render();});
 const n2=$('next2');if(n2)n2.onclick=()=>{st.pains=C().pains.map(p=>p[0]).filter(k=>st.pick.includes(k));if(st.pick.includes('idk'))st.pains=['idk'];const real=st.pains.filter(p=>p!=='idk');st.first=real.length===1?real[0]:null;st.view=st.pains[0];st.step=real.length>1?'q2b':st.tool?'result':'q3';render(true);};
 thread.querySelectorAll('[data-first]').forEach(b=>b.onclick=()=>{st.first=b.dataset.first;st.view=st.first;st.step=st.tool?'result':'q3';render(true);});
 thread.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{st.view=b.dataset.view;render();});
 thread.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{if(b.dataset.go==='summary')st.summary='';st.step=b.dataset.go;render(true);});
 fixes.forEach(f=>{const b=thread.querySelector(`[data-fix="${f.id}"]`);if(!b)return;b.onclick=()=>{
   if(f.from==='name'){st.moreDone=false;st.step='m7';render(true);return;}
   if(f.from==='first'){st.first=null;st.step='q2b';render(true);return;}
   if(f.from==='pains'){st.pick=[...st.pains];st.pains=[];st.first=null;st.tool=null;MORE.forEach(k=>st[k]=null);st.moreDone=false;st.summary='';st.step='q2';render(true);return;}
   resetFrom(f.from);if(f.from==='entry')st.step='start';else st.step=f.step;render(true);};});
 thread.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{st.color=b.dataset.color;const n=$('storeName');if(n)st.name=n.value.trim();render();});
 const rd=$('redraw');if(rd)rd.onclick=()=>{st.name=$('storeName').value.trim();st.moreDone=true;st.step='result2';render(true);};
 const und=$('und');if(und)und.oninput=()=>{st.summary=und.value;};
 const cp=$('copy');if(cp)cp.onclick=()=>{const txt=buildSummary()+'\n제가 이해한 것: '+(st.summary||'');const t=$('toast');
   const sel=()=>{const r=document.createRange();r.selectNodeContents($('sumText'));const s=getSelection();s.removeAllRanges();s.addRange(r);t.textContent='복사가 막혀 글을 선택해 두었습니다. 길게 눌러 복사해 주십시오.';};
   try{navigator.clipboard.writeText(txt).then(()=>t.textContent='복사했습니다. 1:1 채팅에 붙여 넣어 주십시오.',sel);}catch(e){sel();}};
 const rs=$('restart');if(rs)rs.onclick=()=>{Object.assign(st,{step:'start',entry:null,ind:null,pains:[],pick:[],first:null,view:null,tool:null,a0:null,a1:null,a2:null,name:'',color:COLORS[0][0],moreDone:false,summary:''});render(true);};
 if(scroll)requestAnimationFrame(()=>{const last=thread.lastElementChild;if(!last)return;
   if(thread.scrollHeight>thread.clientHeight+4)thread.scrollTop=thread.scrollHeight;else if(innerWidth<=900)last.scrollIntoView({block:'nearest',behavior:'smooth'});});
}

{const hk=location.hash.slice(1);if(hk==='mart'||hk==='food'||hk==='golf'||hk==='web'||hk==='realty')Object.assign(st,{entry:'q',ind:hk,step:'q2'});}
render();
window.__bot={st,render,T};
})();
</script>
